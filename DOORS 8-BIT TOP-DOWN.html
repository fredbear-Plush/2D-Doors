<title>DOORS 8-BIT TOP-DOWN</title>

<style>
:root{--bg:#050303;--fg:#e8d9b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050303;--fg:#e8d9b0}}
:root[data-theme="dark"]{--bg:#050303;--fg:#e8d9b0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{display:flex;align-items:center;justify-content:center;font-family:'Kode Mono',monospace;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
canvas{width:min(100vw,calc(100vh*16/9));image-rendering:pixelated;display:block;background:#000}
#ui{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;gap:6px;font-size:11px;font-weight:700}
#ui label,#ui button{border:2px solid var(--fg);background:#000a;color:var(--fg);padding:7px 8px;font:inherit;cursor:pointer}
#tc{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
#tc>*{pointer-events:auto}
#dp{display:grid;grid-template:repeat(2,46px)/repeat(3,46px);gap:3px}
#tc div.b{border:2px solid var(--fg);background:#0008;display:flex;align-items:center;justify-content:center;font-size:14px;user-select:none;touch-action:none}
@media (hover:hover) and (pointer:fine){#tc{display:none}}
*{font-family:'Kode Mono',monospace!important}
#ui{flex-wrap:wrap;justify-content:flex-end;max-width:72vw}
#login{position:fixed;inset:0;z-index:20;background:#050303f4;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:16px}
#login h1{font-size:44px;color:#e8c060;margin:0;text-shadow:4px 4px #a02020;letter-spacing:4px}
#login p{margin:0;font-size:12px;color:#c8a040}
#login button{border:3px solid var(--fg);background:#000;color:var(--fg);padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;min-width:250px}
#login button:hover{background:#2a1608}
#lmsg{color:#ff8a6a;font-size:11px;max-width:330px;min-height:14px}
.ov{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:#050303e8;padding:12px;box-sizing:border-box}
.pn{width:min(600px,100%);max-height:100%;overflow:auto;border:3px solid #d8b030;background:#0c0603;padding:14px 16px;box-sizing:border-box;color:#e8d9b0;font-size:13px}
.pn h2{margin:0 0 6px;color:#d8b030;font-size:22px;letter-spacing:2px;text-shadow:2px 2px #6a1010}
.pn h3{margin:16px 0 6px;color:#d8b030;font-size:14px}
.pn button,.pn .lb{border:2px solid #e8d9b0;background:#000;color:#e8d9b0;padding:8px 10px;font-weight:700;cursor:pointer;font-size:12px;display:inline-block}
.pn button:hover,.pn .lb:hover{background:#2a1608}.pn button:disabled{opacity:.4;cursor:default}
.pn button.go{border-color:#d8b030;color:#ffd860}
.pn input{background:#000;border:2px solid #887755;color:#e8d9b0;padding:8px;font-size:12px;min-width:0;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sv{display:flex;gap:8px;align-items:center;border:2px solid #3a2a1a;padding:8px;margin:6px 0;flex-wrap:wrap}.sv .nm{flex:1;min-width:140px}
.small{font-size:10px;color:#aa9a78;line-height:1.5}.err{color:#ff8a6a;font-size:11px;min-height:16px;margin:6px 0}
.tag{border:1px solid #ff8a6a;color:#ff8a6a;padding:2px 5px;font-size:10px}.tag.open{border-color:#66cc66;color:#66cc66}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.pc{border:2px solid #3a2a1a;padding:8px;text-align:center;cursor:pointer;transition:box-shadow .1s}.pc:hover{border-color:#887755}
.pc.talk{border-color:#6ab0ff;box-shadow:0 0 10px #6ab0ff}.pc canvas{width:56px;height:96px;image-rendering:pixelated}.pn2{font-weight:700;color:#ffd860;font-size:12px;word-break:break-all}
</style>

function localDB(){const P='dn|',ls=localStorage,L=new Set(),DC=new Set();let pend=0,pc=0;

 const dig=(o,k)=>o[k]=(o[k]&&typeof o[k]=='object')?o[k]:{};
 function read(p){const pre=P+p;let out=null;for(const k of keys().filter(k=>k==pre||k.startsWith(pre+'/')).sort((a,b)=>a.length-b.length)){let v;try{v=JSON.parse(ls.getItem(k))}catch(e){continue}
  if(k==pre){out=v;continue}if(!out||typeof out!='object')out={};const rest=k.slice(pre.length+1).split('/');let o=out;for(let j=0;j<rest.length-1;j++)o=dig(o,rest[j]);o[rest[rest.length-1]]=v}return out}
 function wr(p,v){const parts=p.split('/');
  for(let j=1;j<parts.length;j++){const ak=P+parts.slice(0,j).join('/'),s=ls.getItem(ak);if(s!=null){let b;try{b=JSON.parse(s)}catch(e){b={}}if(!b||typeof b!='object')b={};let o=b;const rest=parts.slice(j);for(let q=0;q<rest.length-1;q++)o=dig(o,rest[q]);if(v==null)delete o[rest[rest.length-1]];else o[rest[rest.length-1]]=v;ls.setItem(ak,JSON.stringify(b));return}}
  const pre=P+p;keys().forEach(k=>{if(k.startsWith(pre+'/'))ls.removeItem(k)});if(v==null)ls.removeItem(pre);else ls.setItem(pre,JSON.stringify(v))}
 const fire=()=>{pend=0;L.forEach(l=>{const v=read(l.p),s=JSON.stringify(v);if(s!==l.s){l.s=s;try{l.cb(v)}catch(e){console.error(e)}}})};
 const soon=()=>{if(!pend){pend=1;setTimeout(fire,0)}};
 addEventListener('storage',e=>{if(!e.key||e.key.startsWith(P))soon()});
 addEventListener('pagehide',()=>DC.forEach(p=>{try{wr(p,null)}catch(e){}}));
 const Wr=(p,v)=>{try{wr(p,v==null?null:clean(v))}catch(e){console.warn(e)}soon();return Promise.resolve()};
 return{local:1,set:Wr,update:(p,v)=>{const o=read(p);return Wr(p,Object.assign(o&&typeof o=='object'?o:{},v))},get:p=>Promise.resolve(read(p)),

function smooth(dt){const me=NET&&NET.game?NET.me:null,k=Math.min(1,dt*14);G.P.forEach(p=>{if(p.rx==null||Math.abs(p.px-p.rx)+Math.abs(p.py-p.ry)>60||!me||p.u==me){p.rx=p.px;p.ry=p.py}else{p.rx+=(p.px-p.rx)*k;p.ry+=(p.py-p.ry)*k}})}

// ---------- stats + coins for your own player ----------
function trackMe(){const p=myP();if(!p||!G)return;const S=PF.stats;
 if(NET.trRun!==G.run){NET.trRun=G.run;NET.trRd=p.rd|0;NET.trDead=p.dead;NET.banked=0;S.games++;save();netPub();return}
 if((p.rd|0)>NET.trRd){S.doors+=(p.rd|0)-NET.trRd;NET.trRd=p.rd|0;S.best=Math.max(S.best,G.room|0);PF.best=Math.max(PF.best,G.room|0);save();netPub()}
 if(p.dead&&!NET.trDead){S.deaths++;save();netPub()}NET.trDead=p.dead;
 if((st=='dead'||st=='win')&&!NET.banked)netBank(st=='win')}
function netBank(win){if(!NET||NET.banked||!G)return;NET.banked=1;const p=myP();if(!p)return;PF.coins+=p.coins|0;['cr','bd','lp'].forEach(k=>PF.inv[0][k]+=p[k]|0);G.gain=p.coins|0;
 PF.best=Math.max(PF.best,G.room|0);PF.stats.best=Math.max(PF.stats.best,PF.best);if(win)PF.stats.wins++;save();netPub()}
function netEsc(){const n=performance.now();if(n-NET.esc<2500){NET.esc=0;if(NET.host)hostToLobby();else leaveNet('YOU LEFT THE SERVER')}else NET.esc=n}

function netTick(dt){vcLevels();if(!NET)return;NET.hb-=dt;NET.ui-=dt;
 if(NET.hb<=0){NET.hb=4;DB.update(`rooms/${NET.sid}/players/${NET.me}`,{ts:tnow()}).catch(()=>{});
  if(NET.host){DB.update('lobby/'+NET.sid,{ts:tnow(),c:Object.keys(NET.players).length||1,s:NET.game?'game':'lobby'}).catch(()=>{});for(const u in NET.players)if(u!=NET.me&&tnow()-(NET.players[u].ts||0)>25000){DB.remove(`rooms/${NET.sid}/players/${u}`);DB.remove(`rooms/${NET.sid}/in/${u}`)}}
  else if(NET.info&&tnow()-(NET.info.ts||0)>30000){leaveNet('THE HOST DISCONNECTED');return}
  vcSync()}
 if(NET.ui<=0){NET.ui=.2;document.querySelectorAll('.pc[data-u]').forEach(el=>el.classList.toggle('talk',talking(el.dataset.u)));const v=document.getElementById('vs');if(v)v.textContent=vcStatus();MIC.textContent=(VC.muted?'MIC OFF':'MIC ON')+' (M)'}
 if(!NET.game||!G)return;
 if(NET.host){applyInputs();NET.t-=dt;if(NET.t<=0&&G.R){NET.t=1/12;DB.set(`rooms/${NET.sid}/state`,snap()).catch(()=>{})}}
 else{NET.inT-=dt;if(NET.inT<=0){NET.inT=1/15;sendInput()}}
 trackMe();vcVolumes()}

// ---------- voice chat (WebRTC, peer to peer) ----------
const VC={st:null,pc:{},au:{},an:{},lv:{},q:{},seen:{},ch:{},muted:0,on:0,err:''};
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
async function vcStart(){if(!NET)return;const sid=NET.sid;
 if(!navigator.mediaDevices||!window.RTCPeerConnection){VC.err='VOICE CHAT IS NOT SUPPORTED IN THIS BROWSER';return}
 try{VC.st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});VC.st.getAudioTracks().forEach(t=>t.enabled=!VC.muted);VC.err=''}catch(e){VC.err='MIC BLOCKED - YOU CAN STILL HEAR OTHERS'}
 if(!NET||NET.sid!==sid){vcStop();return}
 if(VC.st)vcMeter(NET.me,VC.st);VC.on=1;NET.unsub.push(DB.on(`rooms/${sid}/sig/${NET.me}`,v=>vcSig(v||{})));vcSync()}
function vcStop(){for(const u in VC.pc)vcDrop(u);if(VC.st)VC.st.getTracks().forEach(t=>t.stop());Object.assign(VC,{st:null,on:0,seen:{},ch:{},q:{},an:{},lv:{},err:''})}
function vcSend(u,m){if(!NET)return;m.ts=tnow();DB.push(`rooms/${NET.sid}/sig/${u}/${NET.me}`,clean(m)).catch(()=>{})}
function vcPeer(u,init){const pc=new RTCPeerConnection(ICE);VC.pc[u]=pc;VC.q[u]=[];
 if(VC.st)VC.st.getTracks().forEach(t=>pc.addTrack(t,VC.st));else pc.addTransceiver('audio',{direction:'recvonly'});
 pc.onicecandidate=e=>{if(e.candidate)vcSend(u,{t:'ice',d:e.candidate.toJSON()})};
 pc.ontrack=e=>{const s=e.streams[0]||new MediaStream([e.track]);let a=VC.au[u];if(!a){a=VC.au[u]=new Audio();a.autoplay=true}a.srcObject=s;a.play().catch(()=>{});vcMeter(u,s)};
 pc.onconnectionstatechange=()=>{if(VC.pc[u]===pc&&pc.connectionState=='failed')vcDrop(u)};
 if(init)(async()=>{const o=await pc.createOffer();await pc.setLocalDescription(o);vcSend(u,{t:'offer',d:{type:o.type,sdp:o.sdp}})})().catch(()=>{});
 return pc}
function vcDrop(u){const pc=VC.pc[u];if(pc){try{pc.close()}catch(e){}}delete VC.pc[u];const a=VC.au[u];if(a){a.pause();a.srcObject=null}delete VC.au[u];delete VC.an[u];delete VC.lv[u];VC.q[u]=[]}
function vcSync(){if(!VC.on||!NET)return;const ids=Object.keys(NET.players).filter(u=>u!=NET.me);for(const u in VC.pc)if(!ids.includes(u))vcDrop(u);ids.forEach(u=>{if(!VC.pc[u]&&NET.me<u)vcPeer(u,1)})}
function vcSig(t){for(const f in t){const ms=t[f]||{};Object.keys(ms).sort().forEach(id=>{const k=f+'/'+id;if(VC.seen[k])return;VC.seen[k]=1;const m=ms[id];if(!m||!NET||(m.ts||0)<NET.joinT-3000)return;VC.ch[f]=(VC.ch[f]||Promise.resolve()).then(()=>vcHandle(f,m)).catch(e=>console.warn('voice',e))})}}
async function vcHandle(u,m){if(!NET||!VC.on)return;let pc=VC.pc[u];
 if(m.t=='offer'){if(pc)vcDrop(u);pc=vcPeer(u,0);await pc.setRemoteDescription(m.d);await vcFlush(u);const a=await pc.createAnswer();await pc.setLocalDescription(a);vcSend(u,{t:'answer',d:{type:a.type,sdp:a.sdp}})}
 else if(m.t=='answer'){if(pc&&pc.signalingState=='have-local-offer'){await pc.setRemoteDescription(m.d);await vcFlush(u)}}
 else if(m.t=='ice'){if(pc&&pc.remoteDescription)await pc.addIceCandidate(m.d).catch(()=>{});else(VC.q[u]=VC.q[u]||[]).push(m.d)}}
async function vcFlush(u){const q=VC.q[u]||[];VC.q[u]=[];for(const c of q)if(VC.pc[u])await VC.pc[u].addIceCandidate(c).catch(()=>{})}
function vcMeter(u,s){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const src=AC.createMediaStreamSource(s),an=AC.createAnalyser();an.fftSize=256;src.connect(an);VC.an[u]={an,b:new Uint8Array(256)}}catch(e){}}
function vcLevels(){for(const u in VC.an){const{an,b}=VC.an[u];an.getByteTimeDomainData(b);let s=0;for(let i=0;i<b.length;i++){const d=(b[i]-128)/128;s+=d*d}VC.lv[u]=(VC.lv[u]||0)*.6+Math.sqrt(s/b.length)*.4}}
const talking=u=>!!NET&&VC.on&&(VC.lv[u]||0)>.025&&!(u==NET.me&&VC.muted)&&!(NET.players[u]&&NET.players[u].mu);
function vcVolumes(){const me=myP();for(const u in VC.au){let v=1;if(me){const p=G.P.find(q=>q.u==u);if(p){const d=Math.hypot(p.px-me.px,p.py-me.py);v=Math.max(.12,Math.min(1,1-(d-140)/360))}}VC.au[u].volume=v}}
function vcToggle(){VC.muted^=1;if(VC.st)VC.st.getAudioTracks().forEach(t=>t.enabled=!VC.muted);const b=document.getElementById('vb');if(b)b.textContent=VC.muted?'MIC: OFF':'MIC: ON';MIC.textContent=(VC.muted?'MIC OFF':'MIC ON')+' (M)';netPub()}
function vcStatus(){if(VC.err)return VC.err;if(!VC.on)return'STARTING VOICE CHAT... (ALLOW THE MICROPHONE)';const c=Object.values(VC.pc).filter(p=>p.connectionState=='connected').length;return'VOICE CHAT ON - TALKING WITH '+c+' PLAYER'+(c==1?'':'S')}
MIC.onclick=vcToggle;
addEventListener('pointerdown',()=>{try{if(AC&&AC.state=='suspended')AC.resume()}catch(e){}});

let micV;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!MUF.paused&&!(st=='play'&&G&&G.R&&G.R.mf&&G.R.mf.on&&!G.cut&&!G.open))MUF.pause();if(st!=pst){pst=st;ui.style.display=st=='title'?'flex':'none'}const mv2=!!(NET&&NET.game);if(mv2!==micV){micV=mv2;MIC.style.display=mv2?'block':'none'}
 if(egg){egg.t+=dt;if(egg.t>4.5)closeEgg()}else if(st=='play'&&G){if(NET&&NET.game&&!NET.host)cUpd(dt);else upd(dt)}
 try{netTick(dt)}catch(e){console.error(e)}if(G&&G.P)smooth(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
